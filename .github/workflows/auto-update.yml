name: Auto Update SDK

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: auto-update-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      pending_publish: ${{ steps.check-changes.outputs.pending_publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for version comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Regenerate SDK
        run: |
          echo "Regenerating SDK with latest OpenAPI specification..."
          pnpm openapi:rebuild
          echo "SDK regenerated successfully"

      - name: Check for actual changes
        id: check-changes
        run: |
          echo "Checking for actual file changes..."

          # Detect a version that was committed but never published
          # (e.g. a previous run pushed the bump commit and then failed to publish)
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "@meeting-baas/sdk" version 2>/dev/null || echo "none")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Version $LOCAL_VERSION is committed but npm has $PUBLISHED_VERSION - publish pending"
            echo "pending_publish=true" >> $GITHUB_OUTPUT
          else
            echo "pending_publish=false" >> $GITHUB_OUTPUT
          fi

          # Get all changed & untracked files
          #   • modified / deleted:   git diff --name-only
          #   • added      :         git ls-files --others --exclude-standard
          CHANGED_FILES="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in generated files"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Filter out webhook files since they are purely documentation and shouldn't trigger a new release
          FILTERED_CHANGES=$(echo "$CHANGED_FILES" | grep -v "src/generated/v1/api/webhooks/" || true)

          if [ -z "$FILTERED_CHANGES" ]; then
            echo "Only webhook documentation changes detected - ignoring"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "API schema changes detected:"
            echo "$FILTERED_CHANGES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  test:
    if: needs.check-and-update.outputs.has_changes == 'true' || needs.check-and-update.outputs.pending_publish == 'true'
    uses: ./.github/workflows/test-sdk.yml
    needs: check-and-update
    with:
      node-versions: '[18, 19, 20, 21, 22]'
      upload-coverage: 'false'

  bump-version-and-publish:
    if: needs.check-and-update.outputs.has_changes == 'true' || needs.check-and-update.outputs.pending_publish == 'true'
    runs-on: ubuntu-latest
    needs: [check-and-update, test]
    # The npm trusted publisher for @meeting-baas/sdk is configured with
    # GitHub environment "NPM_TOKEN"; the OIDC claim must match it exactly
    # or the token exchange is rejected and publish falls back to ENEEDAUTH.
    environment: NPM_TOKEN
    permissions:
      id-token: write   # Required for OIDC with npm trusted publishing
      contents: write   # Required for checkout and to push version-bump commit
    outputs:
      new_version: ${{ steps.bump-version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: no registry-url here. Setting it makes setup-node write an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN} and export a placeholder
      # token, which short-circuits npm trusted publishing (OIDC) and makes
      # the publish fail with E404.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Node 22 bundles npm 10.x, which predates trusted publishing.
      # npm >= 11.5.1 is required for OIDC-based publishes.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump patch version
        id: bump-version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          if [ "${{ needs.check-and-update.outputs.has_changes }}" = "true" ]; then
            # Bump patch version
            NEW_VERSION=$(pnpm version patch --no-git-tag-version)
          else
            # Republish of an already-committed version that never reached npm
            NEW_VERSION="v$CURRENT_VERSION"
            echo "No API changes - republishing pending version $NEW_VERSION"
          fi
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 🔨 Re-build artefacts *after* bumping the version with new open api spec
      - name: Build SDK
        run: pnpm openapi:rebuild

      - name: Commit and push changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit (republish of pending version)"
          else
            git commit -m "chore: auto-update SDK to ${{ steps.bump-version.outputs.new_version }} [skip ci]"
            git push origin main
          fi

      # npm >= 11.5.1 exchanges the GitHub OIDC token for npm credentials
      # automatically when a trusted publisher is configured for the package.
      - name: Publish to npm
        run: npm publish --access public

  create-release:
    if: needs.check-and-update.outputs.has_changes == 'true' || needs.check-and-update.outputs.pending_publish == 'true'
    runs-on: ubuntu-latest
    needs: [check-and-update, bump-version-and-publish]
    permissions:
      contents: write # Required to create the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version-and-publish.outputs.new_version }}
          name: Release ${{ needs.bump-version-and-publish.outputs.new_version }}
          body: |
            🤖 Auto-generated release

            This release was automatically generated due to changes in the Meeting BaaS API specification.

            ## Changes
            - Updated SDK to match latest API specification
            - All tests passing across Node.js versions 18, 19, 20, 21, and 22

            ## Testing
            - ✅ Node.js 18
            - ✅ Node.js 19
            - ✅ Node.js 20
            - ✅ Node.js 21
            - ✅ Node.js 22
          draft: false
          prerelease: false
